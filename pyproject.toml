[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-content-extractor"
version = "1.0.0"
description = "Local CPU content extraction CLI with evidence, no research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["faster-whisper==1.2.1", "ctranslate2==4.8.5", "av==16.1.0", "jsonschema>=4.23,<5", "yt-dlp>=2026.10.26", "psutil>=7,<8"]

[project.optional-dependencies]
ocr = ["rapidocr_onnxruntime==1.4.4"]

[project.scripts]
content-extractor = "content_extractor.cli:main"

[tool.setuptools.package-data]
content_extractor = ["schemas/*.json"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["content_extractor*"]
