name: Windows unit and contract tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      PYTHONUTF8: '1'
      CONTENT_EXTRACTOR_MODEL_DIR: intentionally-missing-ci-models
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install lightweight test dependencies and package
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps .
      - name: Confirm inference packages are not installed
        run: python -c "import importlib.util; assert all(importlib.util.find_spec(n) is None for n in ['faster_whisper', 'ctranslate2', 'rapidocr_onnxruntime'])"
      - name: Check repository hygiene and documentation links
        run: python scripts/check_repository.py
      - name: Run CLI, schema, extraction and supervisor tests
        run: python -m unittest discover -s tests -v
      - name: Run provisioning and bootstrap tests without downloads
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Check CLI entry point
        run: content-extractor --version --json
